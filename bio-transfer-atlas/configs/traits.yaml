    note: "Duffy-null (ACKR1/rs2814778) positive control for AFR portability risk"

  rheumatoid_arthritis_panel:
    label: "Rheumatoid Arthritis (autoimmune MHC stress-test)"
    pgs_search_term: "rheumatoid arthritis"
