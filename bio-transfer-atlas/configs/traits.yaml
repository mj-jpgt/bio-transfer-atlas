# Trait definitions for bio-transfer-atlas
# MVP traits first; expansion traits listed below.

mvp_traits:
  coronary_artery_disease:
    label: "Coronary Artery Disease"
    pgs_search_term: "coronary artery disease"
    efo_id: "EFO_0001645"
    category: cardiovascular
    note: "Strong EUR GWAS history; lipid/inflammatory pathway interest"

  type_2_diabetes:
    label: "Type 2 Diabetes"
    pgs_search_term: "type 2 diabetes"
    efo_id: "EFO_0001360"
    category: metabolic
    note: "Strong EUR + EAS GWAS; insulin/adipogenesis pathway interest"

  body_mass_index:
    label: "Body Mass Index"
    pgs_search_term: "body mass index"
    efo_id: "EFO_0004340"
    category: anthropometric
    note: "Continuous trait; many scores available across ancestries"

